[project]
name = "hf-gcp"
version = "0.1.0"
description = "Hugging Face CLI extension to plan and deploy Hub models on Google Cloud Vertex AI."
readme = "README.md"
authors = [{ name = "Enrique Hernández Calabrés", email = "ehcalabres@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "google-api-core>=2.28,<3",
    "google-auth[requests]>=2.45,<3",
    "google-cloud-aiplatform>=1.135,<3",
    "google-cloud-logging>=3.0,<4",
    "huggingface-hub>=1.3.4,<3",
    "rich>=14,<16",
    "rich-argparse>=1.7.2,<2",
]

[project.urls]
Homepage = "https://github.com/ehcalabres/hf-gcp"
Issues = "https://github.com/ehcalabres/hf-gcp/issues"

[project.scripts]
hf-gcp = "hf_gcp.cli:main"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["uv_build>=0.9.5,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.14"]

[tool.ruff]
line-length = 119
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
